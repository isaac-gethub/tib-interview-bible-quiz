<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senior SAP Controls Consultant: Interview Bible Quiz</title>
<style>
:root{--navy:#1F3864;--blue:#2f5597;--bg:#f4f6fa;--card:#fff;--line:#d9dfea;--ink:#1d2433;--mute:#667085;--g:#1e7b34;--gb:#e6f4ea;--a:#b26a00;--ab:#fff4e0;--r:#b42318;--rb:#fdecea}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0;flex:1 1 200px;line-height:1.25}header h1 small{display:block;font-weight:400;opacity:.8;font-size:12px}
header select,header button{font:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:0}
header button,header a.jr{background:#fff;color:var(--navy);cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
header a.jr{font-size:14px;padding:7px 9px;border-radius:8px;background:#e8f1fc}
main{max-width:860px;margin:0 auto;padding:14px}
h2{font-size:20px;color:var(--navy);margin:6px 0 10px}h3{font-size:16px;color:var(--navy);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.bar{height:10px;background:#e4e8f0;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;font-size:14px;text-align:left;min-width:92px;color:var(--ink)}
.chip b{display:block;font-size:13px}.chip span{font-size:12px;color:var(--mute)}
.chip.g{background:var(--gb);border-color:#9fd3ab}.chip.a{background:var(--ab);border-color:#f0c070}.chip.r{background:var(--rb);border-color:#f0a8a0}
.btn{font:inherit;font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;margin:4px 6px 4px 0}
.btn.alt{background:#fff;color:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}
.meta{color:var(--mute);font-size:13px}
.read{background:#f7f8fb;border-left:4px solid var(--blue);padding:10px 12px;border-radius:6px;margin:8px 0;font-size:14.5px}
.read h4{margin:10px 0 4px;color:var(--navy);font-size:14.5px}.read p{margin:3px 0}.read ul{margin:4px 0 4px 18px;padding:0}
details>summary{cursor:pointer;font-weight:700;color:var(--navy);padding:4px 0}
.q{padding:12px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.qt{font-weight:700;margin-bottom:8px}.tag{font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.scn{background:#eef2fa;border-radius:8px;padding:10px 12px;font-style:italic;margin:6px 0;font-size:14.5px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;color:var(--ink)}
.opt b{display:inline-block;width:22px;color:var(--blue)}.opt.sel{border-color:var(--blue);background:#eaf0fb}
.opt.ok{background:var(--gb);border-color:#7fc08f}.opt.bad{background:var(--rb);border-color:#e59a92}.opt[disabled]{cursor:default}
.exp{background:#f7f8fb;border-radius:8px;padding:8px 10px;font-size:14px;margin-top:6px}
.res{text-align:center;padding:16px}.big{font-size:44px;font-weight:700;color:var(--navy);line-height:1.1}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:700;font-size:14px}.pill.g{background:var(--gb);color:var(--g)}.pill.a{background:var(--ab);color:var(--a)}.pill.r{background:var(--rb);color:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}th{background:#e9eef8}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;margin:0 -14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:16px;line-height:1.55}
.doc h1{font-size:22px;color:var(--navy);margin:26px 0 8px;scroll-margin-top:84px}.doc h1:first-child{margin-top:0}
.doc h2{font-size:18px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:3px;margin:24px 0 8px;scroll-margin-top:84px}
.doc h3{font-size:16px;color:var(--navy);margin:14px 0 4px}.doc p{margin:6px 0}.doc ul,.doc ol{margin:6px 0 6px 22px;padding:0}
.doc table{margin:10px 0;display:block;overflow-x:auto}.doc blockquote{margin:6px 0;padding-left:12px;border-left:3px solid var(--line)}
.ap{position:sticky;top:60px;z-index:3;background:#eef2fa;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ap span{font-weight:700;color:var(--navy);font-size:14px}.ap audio{flex:1 1 220px;min-width:0;height:36px}.ap small{color:var(--r);width:100%}
.dbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dbar select{font:inherit;font-size:14px;padding:8px;border-radius:8px;border:1px solid var(--line);flex:1 1 220px;min-width:0}
@media(max-width:600px){.doc{padding:12px 12px;font-size:15.5px}.ap{top:0}header{position:static}}
@media(max-width:600px){main{padding:10px}.card{padding:12px}.chip{flex:1 1 44%}.big{font-size:38px}header h1{font-size:14px}}
@media(min-width:880px){main{padding:22px 14px}}
</style></head><body>
<header><h1>Interview Bible Quiz<small>Senior SAP Controls Consultant · TIB Systems LLC</small></h1>
<select id="jump" aria-label="Jump to any quiz"></select><a class="jr" href="https://tib-job-readiness-prep.vercel.app/roadmap.html">← Job Readiness Roadmap</a><button id="hm">Quiz Home</button><button id="rd">Reading + Audio</button><button id="dc">Study Guide</button><button id="pg">Progress</button></header>
<main id="app"></main>
<script>
let DATA,ALL=[],BY={};
const $=s=>document.querySelector(s),app=$('#app');
// storage
let mem={},KEY='tib_mcq_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return mem}}
function save(s){mem=s;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let ST=load();ST.res=ST.res||{};
function status(it,s){if(it.kind==='final')return s>=it.dist?['g','Distinction']:s>=it.pass?['g','Pass']:['r','Not yet'];
 if(it.kind==='review')return s>=5?['g','Pass']:['r','Re-do weak days'];
 return s===5?['g','Mastered']:s===4?['a','Almost: re-read the miss']:['r','Re-read and retake']}
function best(id){const r=ST.res[id];return r?r.best:null}
function cls(it){const r=ST.res[it.id];return r?status(it,r.best)[0]:''}
// jump menu
function buildJump(){const j=$('#jump');j.innerHTML='<option value="">Jump to any quiz…</option>';
 DATA.weeks.forEach(w=>{const g=document.createElement('optgroup');g.label='Week '+w.n+': '+w.title;w.items.forEach(i=>{const o=document.createElement('option');o.value=i.id;o.textContent=i.day+' · '+i.name;g.appendChild(o)});j.appendChild(g)});
 const o=document.createElement('option');o.value='FINAL';o.textContent='Final exam (30 questions)';j.appendChild(o)}
$('#jump').onchange=e=>{if(e.target.value)location.hash=go(e.target.value);e.target.value=''};
$('#hm').onclick=()=>{if(location.hash)location.hash='';else route()};$('#pg').onclick=()=>location.hash='#progress';$('#rd').onclick=()=>location.hash='#reading';$('#dc').onclick=()=>location.hash='#document';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// routes
window.onhashchange=()=>{if(DATA)route()};
function route(){const h=location.hash.slice(1).toUpperCase();window.scrollTo(0,0);
 if(BY[h])return quiz(BY[h]);if(h==='PROGRESS')return progress();if(h==='READING')return docView('reading');if(h==='DOCUMENT')return docView('document');return home()}
const go=id=>'#'+id.toLowerCase();
function home(){const done=ALL.filter(i=>ST.res[i.id]).length;
 let h=`<div class="card"><h2>Pick any week, any quiz</h2><p>Nothing is locked. Read the box at the top of a quiz, answer without notes, then submit to see your score and the reason for every answer. Retake as often as you like; your best score is kept on this device.</p>
 <div class="bar"><i style="width:${done/ALL.length*100}%"></i></div><p class="meta">${done} of ${ALL.length} quizzes attempted · Green = 5/5 (daily), 5+/6 (review), 24+/30 (final) · Amber = 4/5 · Red = below</p></div>`;
 DATA.weeks.forEach(w=>{h+=`<div class="card"><h3>Week ${w.n}: ${esc(w.title)}</h3><div class="chips">`+w.items.map(i=>{const r=ST.res[i.id];return `<button class="chip ${cls(i)}" onclick="location.hash=go('${i.id}')"><b>${i.short}</b><span>${r?'Best '+r.best+'/'+r.total+' · '+r.n+'×':i.qs.length+' questions'}</span></button>`}).join('')+`</div></div>`});
 const f=DATA.final,r=ST.res.FINAL;h+=`<div class="card"><h3>Final exam</h3><p class="meta">30 questions: five case blocks plus ten singles. Open any time.</p><div class="chips"><button class="chip ${cls(f)}" onclick="location.hash='#final'"><b>Final exam</b><span>${r?'Best '+r.best+'/30 · '+r.n+'×':'30 questions'}</span></button></div></div>`;
 app.innerHTML=h}
function progress(){let h='<div class="card"><h2>Your progress</h2><table><tr><th>Quiz</th><th>Best</th><th>Last</th><th>Tries</th><th>Result</th></tr>';
 ALL.forEach(i=>{const r=ST.res[i.id];h+=`<tr><td><a href="#${i.id.toLowerCase()}">${i.id==='FINAL'?'Final exam':'W'+i.week+' '+i.short}</a></td><td>${r?r.best+'/'+r.total:'–'}</td><td>${r?r.last+'/'+r.total:'–'}</td><td>${r?r.n:0}</td><td>${r?status(i,r.best)[1]:'Not started'}</td></tr>`});
 h+='</table></div>';
 const w=ST.wrong||{},ks=Object.keys(w).filter(k=>w[k]&&w[k].length);
 h+='<div class="card"><h3>Wrong-answer log</h3>'+(ks.length?'<p class="meta">Questions you missed on your latest attempt. Say the correct reasoning out loud before you retake.</p>':'<p class="meta">Nothing logged yet.</p>');
 ks.forEach(k=>{const it=BY[k];w[k].forEach(qi=>{const q=it.qs[qi];h+=`<div class="exp"><b>${k==='FINAL'?'Final':'W'+it.week+' '+it.short} Q${qi+1}.</b> ${esc(q.text)}<br><b>Right answer:</b> ${esc(q.opts[0])}<br>${esc(q.exp)}</div>`})});
 h+='</div><button class="btn alt" id="rs">Reset all progress on this device</button>';app.innerHTML=h;
 $('#rs').onclick=()=>{if(confirm('Delete all scores and the wrong-answer log on this device?')){ST={res:{}};save(ST);progress()}}}
// quiz
let A=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startAttempt(it,only){const idx=only||it.qs.map((_,i)=>i);A={it,idx,perm:{},ans:{},done:false,full:!only};idx.forEach(i=>A.perm[i]=shuffle([0,1,2,3]))}
function reading(it){let h='';
 if(it.reading.length||it.also.length||it.note){h+=`<details class="card" ${A.done?'':'open'}><summary>Read first${it.reading.length?' ('+it.reading.map(r=>r.n).join(', ')+')':''}</summary>`;
  if(it.note)h+=`<div class="read">${esc(it.note)}</div>`;
  it.reading.forEach(r=>{h+=`<div class="read"><h4>${r.n} ${esc(r.title)}</h4>`+r.rows.map(x=>`<p>${x[0]?'<b>'+esc(x[0])+'.</b> ':''}${esc(x[1])}</p>`).join('')+'</div>'});
  if(it.also.length)h+=`<div class="read"><h4>Also know</h4><ul>${it.also.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`;
  h+='</details>'}return h}
function quiz(it){if(!A||A.it!==it)startAttempt(it);render()}
function render(){const it=A.it;let h=`<div class="card"><div class="meta">${it.kind==='final'?'Final exam':'Week '+it.week+' · '+it.day}</div><h2>${esc(it.name)}</h2>${A.full?'':'<span class="pill a">Practice: missed questions only (not recorded)</span>'}</div>`;
 h+=reading(it);h+='<div class="card">';
 let lastCase='';A.idx.forEach((qi,n)=>{const q=it.qs[qi];
  if(q.case&&q.case!==lastCase&&A.full){h+=`<h3 style="margin-top:8px">${esc(q.case)}</h3>`;lastCase=q.case}
  if(q.scenario&&A.full)h+=`<div class="scn">${esc(q.scenario)}</div>`;
  h+=`<div class="q"><div class="qt">${n+1}. ${esc(q.text)}<span class="tag">${q.lvl==='R'?'Recall':q.lvl==='A'?'Apply':'Judge'}</span></div>`;
  A.perm[qi].forEach((oi,k)=>{let c='opt';const sel=A.ans[qi]===oi;if(A.done){if(oi===0)c+=' ok';else if(sel)c+=' bad'}else if(sel)c+=' sel';
   h+=`<button class="${c}" ${A.done?'disabled':''} onclick="pick(${qi},${oi})"><b>${'ABCD'[k]}.</b>${esc(q.opts[oi])}</button>`});
  if(A.done)h+=`<div class="exp"><b>${A.ans[qi]===0?'Correct.':'Not quite.'}</b> ${esc(q.exp)}</div>`;h+='</div>'});
 h+='</div>';
 if(!A.done){const n=Object.keys(A.ans).length;h+=`<div class="sticky"><span class="meta">${n} of ${A.idx.length} answered</span><button class="btn" id="sub" ${n<A.idx.length?'disabled':''}>Submit and score</button></div>`}
 else{const s=A.idx.filter(i=>A.ans[i]===0).length,t=A.idx.length;
  if(A.full){const [c,l]=status(it,s);h+=`<div class="card res"><div class="big">${s} / ${t}</div><p><span class="pill ${c}">${l}</span></p>${it.kind==='daily'?'<p class="meta">5/5 green · 4 amber · 3 or less red: re-read and retake tomorrow before new work.</p>':it.kind==='review'?'<p class="meta">You need 5 or 6 to pass.</p>':'<p class="meta">Pass 24+, distinction 27+.</p>'}`}
  else h+=`<div class="card res"><div class="big">${s} / ${t}</div><p class="meta">Practice on missed questions. Retake the full quiz to record a score.</p>`;
  const wrong=A.idx.filter(i=>A.ans[i]!==0);
  h+='<div>'+(wrong.length?`<button class="btn" id="rm">Retake missed only (${wrong.length})</button>`:'')+`<button class="btn alt" id="ra">Retake the whole quiz</button>`;
  const k=ALL.indexOf(it);if(k<ALL.length-1)h+=`<button class="btn alt" onclick="location.hash=go('${ALL[k+1].id}')">Next: ${ALL[k+1].id==='FINAL'?'Final exam':'W'+ALL[k+1].week+' '+ALL[k+1].short}</button>`;
  h+=`<button class="btn alt" onclick="location.hash=''">Home</button></div></div>`;
  if(A.full&&wrong.length)ST.wrong=ST.wrong||{}}
 app.innerHTML=h;
 if(!A.done){const b=$('#sub');if(b)b.onclick=submit}else{const rm=$('#rm'),ra=$('#ra');
  if(rm)rm.onclick=()=>{startAttempt(it,A.idx.filter(i=>A.ans[i]!==0));render();window.scrollTo(0,0)};
  if(ra)ra.onclick=()=>{startAttempt(it);render();window.scrollTo(0,0)}}}
function pick(qi,oi){if(A.done)return;A.ans[qi]=oi;const y=window.scrollY;render();window.scrollTo(0,y)}
function submit(){const it=A.it;A.done=true;const s=A.idx.filter(i=>A.ans[i]===0).length;
 if(A.full){const r=ST.res[it.id]||{best:0,n:0};r.n++;r.last=s;r.total=it.qs.length;r.best=Math.max(r.best,s);ST.res[it.id]=r;
  ST.wrong=ST.wrong||{};ST.wrong[it.id]=A.idx.filter(i=>A.ans[i]!==0);save(ST)}
 render();window.scrollTo(0,0)}

function docView(kind){const rd=kind==='reading';app.innerHTML='<div class="card">Loading…</div>';
 const nm=rd?'reading.html':'mcq.html';
 (async()=>{for(const b of ['docs/','reading/','']){try{const r=await fetch(b+nm);if(r.ok){const x=await r.text();if(x.indexOf('<h1')>-1)return x}}catch(e){}}throw 0})().then(async h=>{
  let AB='audio/';if(rd){for(const b of ['audio/audio/','audio/','']){try{const r=await fetch(b+'Reading_Week_1_Monday.mp3',{method:'HEAD'});if(r.ok){AB=b;break}}catch(e){}}h=h.replace(/src="audio\//g,'src="'+AB)}
  app.innerHTML=`<div class="card"><h2>${rd?'Reading material with audio':'Study guide: questions and answers (read only)'}</h2><p class="meta">${rd?'Read along and press play on any day. Nothing is locked: start from any week.':'The full multiple-choice companion, for reading and reference. To take scored quizzes, use Home.'}</p><div class="dbar"><select id="dj"><option value="">Jump to any week or day…</option></select>${rd?'<label class="meta"><input type="checkbox" id="auto" checked> Play the next day automatically</label>':''}</div></div><div class="doc" id="doc">${h}</div>`;
  const d=$('#doc'),sel=$('#dj');d.querySelectorAll('h1,h2').forEach((e,i)=>{e.id='s'+i;const o=document.createElement('option');o.value=e.id;o.textContent=(e.tagName==='H2'?'   ':'')+e.textContent;sel.appendChild(o)});
  sel.onchange=()=>{const e=document.getElementById(sel.value);if(e)e.scrollIntoView({behavior:'smooth',block:'start'});sel.value=''};
  if(rd){const as=[...d.querySelectorAll('audio')];
   d.addEventListener('error',e=>{if(e.target.tagName==='AUDIO'&&!e.target.parentNode.querySelector('small')){const s=document.createElement('small');s.textContent='This audio file is not available yet.';e.target.parentNode.appendChild(s)}},true);
   as.forEach((a,i)=>{a.addEventListener('play',()=>as.forEach(b=>{if(b!==a)b.pause()}));
    a.addEventListener('ended',()=>{if(!$('#auto').checked)return;const n=as[i+1];if(n){n.parentNode.scrollIntoView({behavior:'smooth',block:'center'});n.play().catch(()=>{})}})})}
 }).catch(()=>{app.innerHTML='<div class="card">Could not load the document. Reload the page.</div>'})}
fetch('data.json').then(r=>r.json()).then(d=>{const X=i=>{i.reading=(i.rd||[]).map(a=>({n:a[0],title:a[1],rows:a[2]}));i.also=i.al||[];i.qs=i.qs.map(q=>({lvl:q.l,text:q.x,opts:q.o,exp:q.e,case:q.ca,scenario:q.ss}));return i};d.weeks.forEach(w=>w.items.forEach(X));X(d.final);DATA=d;DATA.weeks.forEach(w=>w.items.forEach(i=>{i.week=w.n;ALL.push(i)}));DATA.final.week=7;ALL.push(DATA.final);ALL.forEach(i=>BY[i.id]=i);buildJump();route()}).catch(()=>{app.innerHTML='<div class="card">Could not load the question data. Reload the page.</div>'});
</script></body></html>
